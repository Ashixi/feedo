[package]
name = "feedo-rs"
version = "1.0.0"
edition = "2021"
description = "Feedo Web3 Social Network SDK"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
secp256k1 = { version = "0.27", features = ["hashes"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
