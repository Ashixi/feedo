
services:
  feedo-explorer-backend:
    build:
      context: ./feedo_explorer/backend
      dockerfile: Dockerfile
    container_name: feedo-explorer-backend
    restart: always
    ports:
      - "8002:8001"
    environment:
      # Use an SQLite file inside the container for now, mounted to a volume
      - DATABASE_URL=sqlite:///./data/explorer.db
      - NODE_API_URL=http://feedo_node:8040/api/v1
    volumes:
      - explorer_data:/app/data
    # In a real environment, this network should be able to reach feedo-api.
    # For now, if running locally alongside feedo/docker-compose.yml,
    # you might need to connect them via an external network.
    networks:
      - feedo_network

networks:
  feedo_network:
    name: feedo_default
    external: true

volumes:
  explorer_data:
