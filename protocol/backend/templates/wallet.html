<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedo Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-800 rounded-2xl shadow-xl overflow-hidden border border-gray-700">
        
        <!-- Tabs -->
        <div class="flex border-b border-gray-700">
            <button id="tab-topup" onclick="switchTab('topup')" class="flex-1 py-4 text-center font-semibold text-orange-400 border-b-2 border-orange-400 bg-gray-800 transition">Top Up</button>
            <button id="tab-withdraw" onclick="switchTab('withdraw')" class="flex-1 py-4 text-center font-semibold text-gray-400 border-b-2 border-transparent hover:text-gray-200 transition">Withdraw</button>
        </div>

        <div class="p-6">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-yellow-500 mb-2">Feedo Wallet</h1>
                <p id="subtitle" class="text-gray-400 text-sm">Top up your balance with Bitcoin Lightning ⚡</p>
            </div>

            <!-- TOP UP SECTION -->
            <div id="topup-container">
                <!-- Form Section -->
                <div id="form-section">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-300 mb-1">Nostr Pubkey (Hex/npub)</label>
                        <input type="text" id="pubkey" placeholder="npub... or hex" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-orange-500 transition">
                    </div>
                    
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-300 mb-1">Amount (Satoshis)</label>
                        <div class="relative">
                            <input type="number" id="amount" value="1000" min="100" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-orange-500 transition">
                            <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                                <span class="text-gray-400 text-sm">sats</span>
                            </div>
                        </div>
                    </div>

                    <button id="btn-create" onclick="createInvoice()" class="w-full bg-gradient-to-r from-orange-500 to-yellow-500 hover:from-orange-600 hover:to-yellow-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg transform transition hover:scale-105">
                        Generate Invoice
                    </button>
                    <div id="error-msg" class="text-red-400 text-sm mt-3 text-center hidden"></div>
                </div>

                <!-- Invoice Section -->
                <div id="invoice-section" class="hidden flex flex-col items-center">
                    <p class="text-gray-300 mb-4 text-center">Scan to pay <span id="display-amount" class="font-bold text-orange-400"></span> sats</p>
                    
                    <div class="bg-white p-3 rounded-xl mb-4">
                        <div id="qrcode"></div>
                    </div>

                    <div class="w-full relative mb-6">
                        <input type="text" id="lnbc-text" readonly class="w-full bg-gray-700 border border-gray-600 rounded-lg pl-3 pr-10 py-2 text-xs text-gray-300 font-mono">
                        <button onclick="copyInvoice()" class="absolute inset-y-0 right-0 px-3 text-gray-400 hover:text-white transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                        </button>
                    </div>
                    
                    <div class="flex items-center text-yellow-400 animate-pulse">
                        <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-yellow-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Waiting for payment...
                    </div>
                </div>

                <!-- Success Section -->
                <div id="success-section" class="hidden flex flex-col items-center py-6">
                    <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(34,197,94,0.5)]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    <h2 class="text-2xl font-bold text-white mb-2">Payment Received!</h2>
                    <p class="text-gray-400 text-center">Your account has been credited successfully.</p>
                    <button onclick="resetForm()" class="mt-6 text-orange-400 hover:text-orange-300 transition text-sm">Make another deposit</button>
                </div>
            </div>

            <!-- WITHDRAW SECTION -->
            <div id="withdraw-container" class="hidden">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-300 mb-1">Destination Lightning Invoice (lnbc...)</label>
                    <textarea id="withdraw-invoice" rows="3" placeholder="lnbc1..." class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white text-xs font-mono focus:outline-none focus:ring-2 focus:ring-orange-500 transition"></textarea>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-1">Amount to withdraw (Satoshis)</label>
                    <div class="relative">
                        <input type="number" id="withdraw-amount" value="1000" min="1000" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-orange-500 transition">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                            <span class="text-gray-400 text-sm">sats</span>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-700 rounded-lg p-3 text-xs text-gray-300 mb-6 flex items-start">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400 mr-2 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    <span>You will be prompted to sign this withdrawal request securely using your Nostr browser extension (e.g. Alby, nos2x).</span>
                </div>

                <button id="btn-withdraw" onclick="withdrawFunds()" class="w-full bg-gradient-to-r from-blue-500 to-purple-500 hover:from-blue-600 hover:to-purple-600 text-white font-bold py-3 px-4 rounded-lg shadow-lg transform transition hover:scale-105">
                    Sign & Withdraw
                </button>
                <div id="withdraw-msg" class="text-sm mt-3 text-center hidden"></div>
            </div>

        </div>
    </div>

    <script>
        let pollInterval;

        function switchTab(tab) {
            const topupTab = document.getElementById('tab-topup');
            const withdrawTab = document.getElementById('tab-withdraw');
            const topupContainer = document.getElementById('topup-container');
            const withdrawContainer = document.getElementById('withdraw-container');
            const subtitle = document.getElementById('subtitle');

            if (tab === 'topup') {
                topupTab.classList.add('text-orange-400', 'border-orange-400');
                topupTab.classList.remove('text-gray-400', 'border-transparent');
                withdrawTab.classList.add('text-gray-400', 'border-transparent');
                withdrawTab.classList.remove('text-orange-400', 'border-orange-400');
                topupContainer.classList.remove('hidden');
                withdrawContainer.classList.add('hidden');
                subtitle.innerText = "Top up your balance with Bitcoin Lightning ⚡";
            } else {
                withdrawTab.classList.add('text-orange-400', 'border-orange-400');
                withdrawTab.classList.remove('text-gray-400', 'border-transparent');
                topupTab.classList.add('text-gray-400', 'border-transparent');
                topupTab.classList.remove('text-orange-400', 'border-orange-400');
                withdrawContainer.classList.remove('hidden');
                topupContainer.classList.add('hidden');
                subtitle.innerText = "Withdraw your earned satoshis securely 💸";
            }
        }

        // --- TOP UP LOGIC ---
        async function createInvoice() {
            const pubkey = document.getElementById('pubkey').value.trim();
            const amount = parseInt(document.getElementById('amount').value);
            const errorMsg = document.getElementById('error-msg');
            const btn = document.getElementById('btn-create');

            if (!pubkey || isNaN(amount) || amount < 100) {
                errorMsg.innerText = "Valid pubkey and minimum 100 sats required.";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            btn.innerText = "Generating...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/v1/wallet/deposit/request', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ wallet_address: pubkey, amount: amount })
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || "Failed to generate invoice");
                }

                const data = await res.json();
                showInvoice(data.payment_request, amount, data.payment_hash);
            } catch (err) {
                errorMsg.innerText = err.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerText = "Generate Invoice";
                btn.disabled = false;
            }
        }

        function showInvoice(invoiceStr, amount, hash) {
            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('invoice-section').classList.remove('hidden');
            
            document.getElementById('display-amount').innerText = amount;
            document.getElementById('lnbc-text').value = invoiceStr;
            
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: invoiceStr,
                width: 200,
                height: 200,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.M
            });

            startPolling(hash);
        }

        function copyInvoice() {
            const copyText = document.getElementById("lnbc-text");
            copyText.select();
            document.execCommand("copy");
            alert("Invoice copied to clipboard!");
        }

        function startPolling(hash) {
            pollInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/v1/wallet/deposit/status/${hash}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data.status === "PAID") {
                            clearInterval(pollInterval);
                            showSuccess();
                        }
                    }
                } catch (e) {
                    console.error("Polling error", e);
                }
            }, 2000);
        }

        function showSuccess() {
            document.getElementById('invoice-section').classList.add('hidden');
            document.getElementById('success-section').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('success-section').classList.add('hidden');
            document.getElementById('form-section').classList.remove('hidden');
            document.getElementById('lnbc-text').value = "";
            document.getElementById('qrcode').innerHTML = "";
            if (pollInterval) clearInterval(pollInterval);
        }

        // --- WITHDRAW LOGIC ---
        async function withdrawFunds() {
            const invoice = document.getElementById('withdraw-invoice').value.trim();
            const amount = parseInt(document.getElementById('withdraw-amount').value);
            const msgBox = document.getElementById('withdraw-msg');
            const btn = document.getElementById('btn-withdraw');

            if (!invoice.startsWith("lnbc") || isNaN(amount) || amount < 1000) {
                msgBox.innerText = "Valid invoice and minimum 1000 sats required.";
                msgBox.className = "text-red-400 text-sm mt-3 text-center";
                msgBox.classList.remove('hidden');
                return;
            }

            if (!window.nostr) {
                msgBox.innerText = "Nostr extension (like Alby or nos2x) not found! Please install it to sign withdrawals.";
                msgBox.className = "text-red-400 text-sm mt-3 text-center";
                msgBox.classList.remove('hidden');
                return;
            }

            msgBox.classList.add('hidden');
            btn.innerText = "Awaiting Signature...";
            btn.disabled = true;

            try {
                // 1. Get user pubkey from extension
                const pubkey = await window.nostr.getPublicKey();
                
                // 2. Construct the event to sign
                const unsignedEvent = {
                    kind: 1,
                    created_at: Math.floor(Date.now() / 1000),
                    tags: [["invoice", invoice]],
                    content: "WITHDRAW " + amount + " SATS TO " + invoice,
                    pubkey: pubkey
                };

                // 3. Ask user to sign it via extension popup
                const signedEvent = await window.nostr.signEvent(unsignedEvent);

                btn.innerText = "Processing Withdrawal...";

                // 4. Send to backend
                const res = await fetch('/api/v1/wallet/withdraw', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        wallet_address: pubkey, 
                        amount: amount,
                        invoice_string: invoice,
                        event: signedEvent
                    })
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || "Withdrawal failed");
                }

                const data = await res.json();
                msgBox.innerText = "✅ Success! " + data.message;
                msgBox.className = "text-green-400 text-sm mt-3 text-center";
                msgBox.classList.remove('hidden');
                document.getElementById('withdraw-invoice').value = "";

            } catch (err) {
                msgBox.innerText = "❌ " + err.message;
                msgBox.className = "text-red-400 text-sm mt-3 text-center";
                msgBox.classList.remove('hidden');
            } finally {
                btn.innerText = "Sign & Withdraw";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
