<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedo Protocol Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --primary-color: #58a6ff;
            --secondary-color: #1f2428;
            --accent-color: #2ea043;
            --border-color: #30363d;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-weight: 800;
            font-size: 24px;
        }

        .status-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }

        .status-box p {
            margin: 10px 0;
            font-size: 16px;
        }

        .highlight {
            color: var(--primary-color);
            font-weight: bold;
        }

        .btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn:hover {
            background-color: #1f6feb;
        }

        .btn-success {
            background-color: var(--accent-color);
        }

        .btn-success:hover {
            background-color: #238636;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        #top-up-section {
            display: none;
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }
        
        .loader {
            display: none;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Feedo Protocol</h1>
        <p>Unified Semantic Layer Tokenomics</p>

        <button id="connect-btn" class="btn">Connect MetaMask</button>

        <div id="dashboard" style="display: none;">
            <div class="status-box">
                <p>Wallet: <span id="wallet-address" class="highlight">...</span></p>
                <p>Tokens: <span id="token-balance" class="highlight">0</span> FDO</p>
                <p>Free Queries: <span id="free-queries" class="highlight">0</span></p>
            </div>

            <button id="show-topup-btn" class="btn btn-success">Top Up Balance</button>

            <div id="top-up-section">
                <div class="input-group">
                    <label>Amount (MATIC)</label>
                    <input type="number" id="deposit-amount" value="1.0" step="0.1" min="0.1">
                    <small>1 MATIC = 1000 Feedo Tokens</small>
                </div>
                <button id="submit-tx-btn" class="btn">Send Transaction</button>
                <div class="loader" id="loader"></div>
                <p id="tx-status" style="font-size: 14px; color: var(--accent-color);"></p>
            </div>
        </div>
    </div>

    <!-- Ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
