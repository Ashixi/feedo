
services:
  feedo-explorer:
    image: itsshas/feedo-explorer:latest
    container_name: feedo-explorer
    restart: always
    ports:
      - "8002:8001"
    environment:
      # SQLite database for storing indexed metadata inside the container
      - DATABASE_URL=sqlite:///./data/explorer.db
      # URL to the main feedo-api container. 
      # - If using docker-compose.deploy.yml, it is `http://feedo:8040/api/v1`
      # - If using docker-compose.yml (dev), it is `http://feedo_node:8040/api/v1`
      - NODE_API_URL=http://feedo_node:8040/api/v1

    volumes:
      - explorer_data:/app/data
    networks:
      - feedo_network

networks:
  feedo_network:
    # This must match the docker network name used by the main feedo container.
    # If the main app was deployed from `/opt/feedmedia`, it is likely `feedmedia_default`.
    # Run `docker network ls` on the server to check, then update this name.
    name: feedo_default
    external: true

volumes:
  explorer_data:
