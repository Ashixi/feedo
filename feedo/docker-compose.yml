services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      # Змінні автоматично візьмуться з файлу .env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  feedo_node:
    image: ${DOCKER_HUB_NAMESPACE:-feedo-local}/feedo-node:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        RUST_CORE_URL: http://127.0.0.1:8041/local/publish
    restart: always
    ports:
      - "8040:8040"
      - "4001:4001/udp"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RSS_NODE_SECRET=${RSS_NODE_SECRET}
      - RSS_NODE_WALLET=${RSS_NODE_WALLET}
      - RUST_CORE_URL=http://127.0.0.1:8041/local/publish
      - DHT_DB_PATH=/app/db/rust_store
      - PYTHON_API_URL=http://127.0.0.1:8040
      - DHT_RAM_CACHE_LIMIT=1000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - rust_db_data:/app/db

volumes:
  postgres_data:
  rust_db_data: