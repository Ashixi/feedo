version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-feedo_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_db_password_123}
      - POSTGRES_DB=${POSTGRES_DB:-feedo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-feedo_user} -d $${POSTGRES_DB:-feedo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  feedo_hybrid_node:
    build:
      context: .
      dockerfile: Dockerfile.hybrid
    image: itsshas/feedo-node:hybrid
    restart: always
    ports:
      - "8040:8040"          # Python API (HTTP)
      - "4001:4001/udp"      # Rust P2P Matrix
      - "8080:8080"          # Nostr WebSocket Relay
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-feedo_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-secure_db_password_123}
      - POSTGRES_DB=${POSTGRES_DB:-feedo_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-feedo_user}:${POSTGRES_PASSWORD:-secure_db_password_123}@db:5432/${POSTGRES_DB:-feedo_db}
      - RUST_CORE_URL=http://127.0.0.1:8041/local/publish
      - PYTHON_API_URL=http://127.0.0.1:8040
      - RSS_NODE_SECRET=${RSS_NODE_SECRET}
      - NODE_WALLET_PRIVATE_KEY=${NODE_WALLET_PRIVATE_KEY}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:-""}
      - BOOTSTRAP_NODES=${BOOTSTRAP_NODES:-""}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - rust_db_data:/app/db

volumes:
  postgres_data:
  rust_db_data:
