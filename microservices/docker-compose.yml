version: "3.8"

services:
  storage-node:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: storage-node
    ports:
      - "8040:8040/udp"
      - "3001:3001"
      - "50052:50052"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - BOOTSTRAP_NODES=${STORAGE_BOOTSTRAP_NODES:-/dns4/api2.feedo.ink/udp/8040/quic-v1/p2p/12D3KooWCMJpJrVAu4eUsixc28xAWXifYeA2tf6PK3beZLru2GGx,/dns4/api.feedo.ink/udp/8040/quic-v1/p2p/12D3KooWNdq2dFr2mAiwbhzMZCBYG8QmtVSqjxNeSorAsjWozFoe}
    volumes:
      - storage_db:/app/storage_db
    networks:
      - feedo-net

  consensus-node:
    build:
      context: .
      dockerfile: Dockerfile.rust
      target: consensus-node
    ports:
      - "50051:50051"
      - "3000:3000"
      - "8041:8041/udp"
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - ETH_RPC_URL=${ETH_RPC_URL:-https://polygon-rpc.com}
      - P2P_PORT=8041
      - BOOTSTRAP_NODES=${CONSENSUS_BOOTSTRAP_NODES:-/dns4/api2.feedo.ink/udp/8041/quic-v1/p2p/12D3KooWRccQbYbwX3ufZowDwMBxT5LnA5625koUL4FYp7XGbYDt,/dns4/api.feedo.ink/udp/8041/quic-v1/p2p/12D3KooWKMfF1XmYDXTjwNfkEjQMmvZSPcYRhSCP3ibWKwXcnndL}
    volumes:
      - consensus_db:/app/consensus_db
    networks:
      - feedo-net

  search-node:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        APP_DIR: search-node
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - GATEWAYS=${GATEWAYS:-http://storage-node:3001}
      - STORAGE_NODE_URL=${STORAGE_NODE_URL:-http://storage-node:3001}
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - lancedb_data:/app/lancedb_data
      - ./search-node:/app
    depends_on:
      - storage-node
    networks:
      - feedo-net

  social-node:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        APP_DIR: social-node
    ports:
      - "8010:8010"
    environment:
      - PORT=8010
      - HOST=0.0.0.0
      - SEARCH_NODE_URL=${SEARCH_NODE_URL:-http://search-node:8000}
      - GATEWAYS=${GATEWAYS:-http://storage-node:3001}
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8010"]
    volumes:
      - social_data:/app/social_data
      - ./social-node:/app
    depends_on:
      - search-node
      - storage-node
    networks:
      - feedo-net


  feedo-algo:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        APP_DIR: feedo-algo
    environment:
      - DB_PATH=/app/lancedb_data
      - SEARCH_NODE_URL=${SEARCH_NODE_URL:-http://search-node:8000}
      - PYTHONUNBUFFERED=1
    command: ["python", "worker.py"]
    volumes:
      - lancedb_data:/app/lancedb_data
      - ./feedo-algo:/app
    depends_on:
      - search-node
    networks:
      - feedo-net

  feedo-ingester:
    build:
      context: .
      dockerfile: Dockerfile.python
      args:
        APP_DIR: feedo-ingester
    environment:
      - GATEWAYS=${GATEWAYS:-http://storage-node:3001}
      - STORAGE_NODE_URL=${STORAGE_NODE_URL:-http://storage-node:3001}
      - SEARCH_NODE_URL=${SEARCH_NODE_URL:-http://search-node:8000}
      - PYTHONUNBUFFERED=1
    command: ["python", "main.py"]
    volumes:
      - ./feedo-ingester:/app
    depends_on:
      - storage-node
      - search-node
    networks:
      - feedo-net

  feedo-search-ui:
    build:
      context: ./feedo_search_ui
      dockerfile: Dockerfile
      args:
        API_URL: ${PUBLIC_API_URL:-https://api.feedo.ink}
    ports:
      - "8080:80"
    networks:
      - feedo-net

  web2-proxy:
    build:
      context: ./web2-proxy
      dockerfile: Dockerfile
    ports:
      - "8005:8000"
    environment:
      - CONSENSUS_NODE_URL=http://consensus-node:3000
      - STORAGE_NODE_URL=http://storage-node:3001
      - PYTHONUNBUFFERED=1
    depends_on:
      - consensus-node
      - storage-node
    networks:
      - feedo-net

volumes:
  lancedb_data:
  storage_db:
  consensus_db:
  social_data:

networks:
  feedo-net:
    driver: bridge
