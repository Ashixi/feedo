[package]
name = "feedo-keygen"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "feedo-keygen"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha3 = "0.10"
