# ============================================================
#  F E E D O   —  Docker Compose (Follower Node)
# ============================================================
#  Приєднується до бутстрап-ноди 95.111.245.68
#
#  Логіка:
#  - env_file: .env  →  підтягує всі спільні змінні (RUST_LOG, квоти, URL'и, ключі)
#  - environment:     →  перевизначає конфліктуючі (кожен сервіс має свій порт, DB_DIR, ключ)
#  Так змінні не дублюються — все в одному .env, а docker-compose тільки мапить що куди
# ============================================================
version: "3.8"

services:

  # ==========================================================
  #  🟢 STORAGE NODE
  # ==========================================================
  storage-node:
    image: itsshas/storage-node:latest
    container_name: feedo-storage
    ports:
      - "8040:8040/udp"
      - "3001:3001"
      - "50052:50052"
    env_file:
      - .env
    environment:
      # Перевизначаємо те, що відрізняється від consensus-node:
      - NODE_PRIVATE_KEY=${STORAGE_PRIVATE_KEY}    # окремий Ed25519 ключ
      - P2P_PORT=8040
      - HTTP_PORT=3001
      - GRPC_PORT=50052
      - DB_DIR=/app/storage_db
      # BOOTSTRAP_NODES — береться з .env (там storage bootstrap)
    volumes:
      - storage_db:/app/storage_db
    networks:
      - feedo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/quota"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================================
  #  🟠 CONSENSUS NODE
  # ==========================================================
  consensus-node:
    image: itsshas/feedo-consensus-node:latest
    container_name: feedo-consensus
    ports:
      - "8041:8041/udp"
      - "3000:3000"
      - "50051:50051"
    env_file:
      - .env
    environment:
      # Перевизначаємо те, що відрізняється від storage-node:
      - NODE_PRIVATE_KEY=${NODE_PRIVATE_KEY}          # основний Ed25519 ключ
      - BOOTSTRAP_NODES=${CONSENSUS_BOOTSTRAP_NODES}  # consensus bootstrap (інший порт 8041)
      - P2P_PORT=8041
      - HTTP_PORT=3000
      - GRPC_PORT=50051
      - DB_DIR=/app/consensus_db
      # NODE_WALLET_*, ETH_RPC_URL, EPOCH_DURATION_SECS — з .env
    volumes:
      - consensus_db:/app/consensus_db
    networks:
      - feedo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/resolve/test.feedo"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==========================================================
  #  🟣 SEARCH NODE
  # ==========================================================
  search-node:
    image: itsshas/feedo-search-node:latest
    container_name: feedo-search
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Всі змінні search-node читає з .env (SEARCH_PORT, SEARCH_HOST, GATEWAYS, etc.)
      # Тут тільки те, чого немає в .env:
      - PORT=8000
      - HOST=0.0.0.0
      - LANCE_DB_PATH=/app/lancedb_data
      - PYTHONUNBUFFERED=1
    volumes:
      - lancedb_data:/app/lancedb_data
    depends_on:
      - storage-node
    networks:
      - feedo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/explorer/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

# ==========================================================
#  📦 Volumes
# ==========================================================
volumes:
  lancedb_data:
  storage_db:
  consensus_db:

# ==========================================================
#  🌐 Мережа
# ==========================================================
networks:
  feedo-net:
    driver: bridge